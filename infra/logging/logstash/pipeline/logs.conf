# KEIwi 통합 로그 — Logstash 파이프라인 (input → filter → output) (권장본)
# =============================================================================
# 에이전트는 생성만, 적용은 사람이 한다(헌장 §11). 라이브 직접수정 금지(§12). 시크릿 금지(§13).
#
# 데이터 흐름: 각 서버 Filebeat(journald + 선택 파일) → 이 Logstash(data05:5044)
#              → Elasticsearch(keiwi-logs-%{+YYYY.MM.dd}) → Grafana(ES datasource) → 콘솔 임베드.
#
# 이 파이프라인이 "보장"하는 표준 필드(공유 계약):
#   @timestamp  (이벤트 시각)
#   fleet_node  (data04 | data05 | ...   — Filebeat add_fields 로 주입, 여기서 위치 정규화)
#   log_level   (error | warn | info | debug   — 소문자 4종으로 정규화)
#   service     (systemd unit 또는 앱명)
#   message     (원문)
#   host_name   (OS 호스트네임)
#
# journald 메시지 구조 주의: Filebeat journald 입력은 버전/설정에 따라 필드 위치가 다르다.
#   - 신형(ECS 평탄화): host.hostname / systemd.unit / syslog.identifier / syslog.priority / process.name
#   - 구형(journald.* 중첩): journald.host.hostname / journald.process.name / journald.syslog.* 등
#   아래 필터는 두 경우를 모두 방어적으로 처리한다(존재 검사 후 매핑).
#
# 적용(사람이, data05): docker compose 로 logstash 기동 후
#   ES 확인: curl -s 'http://localhost:9200/keiwi-logs-*/_search?size=1&pretty'
# =============================================================================

input {
  beats {
    id => "beats-in"
    port => 5044
    host => "0.0.0.0"
    # 내부망 + Cloudflare Access 뒤라 beats TLS 미사용(§13: 시크릿/인증서 레포밖).
    # 외부 노출 시 ssl 옵션을 사람 적용 단계에서 추가한다.
  }
}

filter {

  # ---------------------------------------------------------------------------
  # 1) fleet_node 정규화
  #    Filebeat add_fields 위치가 환경에 따라 top-level 또는 [fields] 아래로 다름.
  # ---------------------------------------------------------------------------
  if ![fleet_node] {
    if [fields][fleet_node] {
      mutate { add_field => { "fleet_node" => "%{[fields][fleet_node]}" } }
    } else {
      # 마지막 안전망: host_name 기반으로 추정하거나 unknown.
      mutate { add_field => { "fleet_node" => "unknown" } }
    }
  }

  # ---------------------------------------------------------------------------
  # 2) host_name 정규화 (ECS 평탄화 → 구형 중첩 → agent 순으로 폴백)
  # ---------------------------------------------------------------------------
  if ![host_name] {
    if [host][hostname] {
      mutate { add_field => { "host_name" => "%{[host][hostname]}" } }
    } else if [host][name] {
      mutate { add_field => { "host_name" => "%{[host][name]}" } }
    } else if [journald][host][hostname] {
      mutate { add_field => { "host_name" => "%{[journald][host][hostname]}" } }
    } else if [agent][hostname] {
      mutate { add_field => { "host_name" => "%{[agent][hostname]}" } }
    } else {
      mutate { add_field => { "host_name" => "unknown" } }
    }
  }

  # ---------------------------------------------------------------------------
  # 3) service 정규화
  #    우선순위: 이미 설정됨(파일 입력이 지정) > systemd unit > syslog identifier > process 이름.
  # ---------------------------------------------------------------------------
  if ![service] {
    if [systemd][unit] {
      mutate { add_field => { "service" => "%{[systemd][unit]}" } }
    } else if [journald][_SYSTEMD_UNIT] {
      mutate { add_field => { "service" => "%{[journald][_SYSTEMD_UNIT]}" } }
    } else if [journald][systemd][unit] {
      mutate { add_field => { "service" => "%{[journald][systemd][unit]}" } }
    } else if [syslog][identifier] {
      mutate { add_field => { "service" => "%{[syslog][identifier]}" } }
    } else if [journald][syslog][identifier] {
      mutate { add_field => { "service" => "%{[journald][syslog][identifier]}" } }
    } else if [process][name] {
      mutate { add_field => { "service" => "%{[process][name]}" } }
    } else if [journald][process][name] {
      mutate { add_field => { "service" => "%{[journald][process][name]}" } }
    } else if [service_source] {
      # Filebeat가 붙인 입력 힌트(journald|vllm). 파일 입력(vLLM)은 unit/process가 없어 여기로.
      mutate { add_field => { "service" => "%{[service_source]}" } }
    } else {
      mutate { add_field => { "service" => "unknown" } }
    }
  }

  # ---------------------------------------------------------------------------
  # 4) log_level 추출 → error|warn|info|debug 4종으로 정규화
  #
  #    (a) journald PRIORITY(숫자 0-7)를 후보 위치들에서 모아 매핑.
  #    (b) 메시지 본문의 레벨 토큰(ERROR/[WARN]/level=info ...)을 grok — 본문이 더 구체적이므로 우선.
  #    (c) 둘 다 없으면 info 기본.
  # ---------------------------------------------------------------------------

  # (a) PRIORITY 숫자 후보 수집 → [@metadata][priority]
  if [journald][priority] {
    mutate { add_field => { "[@metadata][priority]" => "%{[journald][priority]}" } }
  } else if [syslog][priority] {
    mutate { add_field => { "[@metadata][priority]" => "%{[syslog][priority]}" } }
  } else if [journald][syslog][priority] {
    mutate { add_field => { "[@metadata][priority]" => "%{[journald][syslog][priority]}" } }
  } else if [log][syslog][priority][code] {
    mutate { add_field => { "[@metadata][priority]" => "%{[log][syslog][priority][code]}" } }
  }

  if [@metadata][priority] {
    if [@metadata][priority] in ["0", "1", "2", "3"] {
      mutate { add_field => { "[@metadata][level_from_prio]" => "error" } }
    } else if [@metadata][priority] == "4" {
      mutate { add_field => { "[@metadata][level_from_prio]" => "warn" } }
    } else if [@metadata][priority] in ["5", "6"] {
      mutate { add_field => { "[@metadata][level_from_prio]" => "info" } }
    } else if [@metadata][priority] == "7" {
      mutate { add_field => { "[@metadata][level_from_prio]" => "debug" } }
    }
  }

  # (b) 메시지 본문에서 레벨 토큰 grok (대소문자 무시, 실패해도 태그 안 남김)
  grok {
    id => "grok-level"
    break_on_match => true
    match => {
      "message" => [
        "(?i)\blevel\b\s*[=:]\s*\"?(?<level_text>error|err|warn|warning|info|debug|trace|fatal|critical|crit|notice)",
        "\[(?<level_text>(?i)ERROR|ERR|WARN|WARNING|INFO|DEBUG|TRACE|FATAL|CRITICAL|CRIT|NOTICE)\]",
        "\b(?<level_text>ERROR|WARNING|WARN|FATAL|CRITICAL|DEBUG|TRACE)\b"
      ]
    }
    tag_on_failure => []
  }

  if [level_text] {
    mutate { lowercase => [ "level_text" ] }
    if [level_text] in ["error", "err", "fatal", "critical", "crit", "emerg", "alert", "panic"] {
      mutate { add_field => { "log_level" => "error" } }
    } else if [level_text] in ["warn", "warning"] {
      mutate { add_field => { "log_level" => "warn" } }
    } else if [level_text] in ["info", "information", "notice"] {
      mutate { add_field => { "log_level" => "info" } }
    } else if [level_text] in ["debug", "trace"] {
      mutate { add_field => { "log_level" => "debug" } }
    }
  }

  # (c) 폴백: 본문에서 못 뽑았으면 PRIORITY → 그래도 없으면 info.
  if ![log_level] and [@metadata][level_from_prio] {
    mutate { add_field => { "log_level" => "%{[@metadata][level_from_prio]}" } }
  }
  if ![log_level] {
    mutate { add_field => { "log_level" => "info" } }
  }
  mutate { lowercase => [ "log_level" ] }

  # ---------------------------------------------------------------------------
  # 5) @timestamp 보정
  #    journald 이벤트는 Filebeat가 __REALTIME_TIMESTAMP 기준 @timestamp를 이미 채운다 → 유지.
  #    앱(파일) 로그는 줄머리에 자체 타임스탬프가 있으면 그것으로 보정(없으면 그대로).
  # ---------------------------------------------------------------------------
  if [log][file][path] {
    grok {
      id => "grok-app-ts"
      match => { "message" => "^%{TIMESTAMP_ISO8601:[@metadata][log_ts]}" }
      tag_on_failure => []
    }
    if [@metadata][log_ts] {
      date {
        id => "date-app-ts"
        match => [
          "[@metadata][log_ts]",
          "ISO8601",
          "yyyy-MM-dd HH:mm:ss,SSS",
          "yyyy-MM-dd HH:mm:ss.SSS",
          "yyyy-MM-dd HH:mm:ss"
        ]
        tag_on_failure => []
      }
    }
  }

  # ---------------------------------------------------------------------------
  # 6) 정리 — 임시/중복 필드 제거(ES 인덱스 비대화 방지).
  #    표준 6필드 + journald 원본은 디버깅용으로 남긴다. 필요 없으면 [journald]도 추가 제거 가능.
  # ---------------------------------------------------------------------------
  mutate {
    remove_field => [ "level_text", "fields", "agent", "ecs", "input" ]
  }
}

output {
  opensearch {
    id => "os-out"
    # 컨테이너망 기준 기본값. compose 가 OPENSEARCH_HOSTS env(=http://opensearch:9200)를 주입.
    hosts => ["${OPENSEARCH_HOSTS:http://opensearch:9200}"]
    index => "keiwi-logs-%{+YYYY.MM.dd}"

    # 단일 노드·단순 daily 인덱스(공유 계약). 매핑은 사람이 _index_template PUT(keyword).
    manage_template => false

    # security 비활성이므로 user/password 없음(§13: 시크릿 레포밖).
  }

  # 트러블슈팅용(필요 시 사람이 주석 해제):
  # stdout { codec => rubydebug { metadata => true } }
}
