# KEIwi M2 통합 로그 — Grafana Elasticsearch 데이터소스 (프로비저닝, 권장본)
#
# 에이전트는 생성만, 적용은 사람이 한다(헌장 §11). 라이브는 직접 수정하지 않는다(§12).
# 시크릿(비번/토큰)은 이 파일에 박지 않는다(§13). xpack.security.enabled=false 전제
# (내부망 + Cloudflare Access 뒤). 보안이 켜지면 secureJsonData로 분리한다.
#
# 무엇: data05의 Grafana가 같은 도커망의 Elasticsearch(8.x, single-node)를 읽는
#       ES 데이터소스. 로그 뷰(대시보드 uid=keiwi-logs)가 이 데이터소스를 참조한다.
#
# 적용(사람이, data05에서):
#   1) 이 파일을 라이브 Grafana 프로비저닝 경로에 반영한다. 예:
#        /data/monitoring/grafana/provisioning/datasources/elasticsearch.yaml
#      (라이브 docker-compose의 grafana 볼륨 매핑에 맞춰 경로 조정)
#   2) sudo docker restart grafana   # 또는 compose restart grafana
#   3) Grafana → Connections → Data sources 에서 'keiwi-logs-es' 가 보이고
#      'Save & test' 가 녹색인지 확인(인덱스 keiwi-logs-* 존재 전제).
#
# 전제:
#   · ES 가 같은 도커 네트워크에서 컨테이너명 'elasticsearch:9200' 으로 도달 가능.
#     (호스트에서 검증할 땐 http://localhost:9200)
#   · 인덱스 keiwi-logs-%{+YYYY.MM.dd} 가 Logstash 로 생성됨(시간필드 @timestamp).
#   · uid 는 'keiwi-logs-es' 로 고정한다 — 대시보드(logs.json)가 이 uid 를 직접 참조.

apiVersion: 1

datasources:
  - name: keiwi-logs-es
    uid: keiwi-logs-es
    type: elasticsearch
    access: proxy
    # OpenSearch(ES 호환 모드). 컨테이너망 기준. 호스트 테스트 시 http://localhost:9200.
    url: http://opensearch:9200
    isDefault: false
    # 프로비저닝으로 관리 → UI 편집 잠금(드리프트 방지). 필요 시 true 로.
    editable: false
    jsonData:
      # 단일노드·단순 인덱스. 일자 롤오버 와일드카드.
      index: "keiwi-logs-*"
      timeField: "@timestamp"
      # OpenSearch 호환 모드(compatibility.override_main_response_version=true → ES 7.10 보고).
      # Grafana Elasticsearch 데이터소스가 OpenSearch에 그대로 붙는다. (안 붙으면 grafana-opensearch-datasource 플러그인 검토)
      esVersion: "7.10.0"
      # 로그 패널 표준 필드(공유 계약): message / log_level
      logMessageField: message
      logLevelField: log_level
      maxConcurrentShardRequests: 5
      includeFrozen: false
    # xpack.security.enabled=false 이므로 자격증명 없음. 보안 켜지면 아래로 분리:
    # basicAuth: true
    # basicAuthUser: "${ES_USER}"        # 값은 레포 밖 env 로 주입(§13)
    # secureJsonData:
    #   basicAuthPassword: "${ES_PASSWORD}"
