# Slack 알림 조립 템플릿 — 2채널(contact-points)이 공유한다 (alert-enrichment E1 D1-3)
#
# 왜 별도 파일인가: contact-points의 title/text에 로직을 직접 쓰면 2채널에 중복되고,
# 프로비저닝 env 보간이 `$`를 삼키는 함정(§0.2 — `{{ $labels }}`가 `{{ .labels }}`로 깨져
# 2026-08-03 첫 실전 알림 제목에 리터럴이 노출된 그 사고)을 매번 피해 다녀야 한다.
# 이 파일은 **`$` 문자를 아예 쓰지 않는 형태**로 짠다 — 값 렌더(printf·humanize)는
# 규칙 annotation에서 이미 끝났고(발화 시점 확정), 여기서는 조립만 한다(정석:
# 값 포맷팅 함수는 규칙 템플릿에만 있고 notification 템플릿에는 없다).
#
# 링크는 Slack mrkdwn `<url|라벨>` 문법. console_url·drilldown_url은 E2가 규칙
# annotation으로 넣는다 — 없으면 조용히 생략된다(E1 단독으로도 성립).
#
# ⚠️ `.DashboardURL` 분기는 **없다**(2026-08-04 제거). Grafana가 `.DashboardURL` 을 채우려면
#    규칙에 `__dashboardUid__` annotation 이 있어야 하는데, 실적용에서 Grafana가
#    `__panelId__` 동반을 강제해 프로비저닝이 실패했다 → 14규칙 전부에서 제거했다
#    (alert-rules.yaml 의 같은 날짜 주석 참조). 즉 그 분기는 **영구히 빈 값**이었고,
#    분기가 남아 있으면 "언젠가 대시보드 링크가 나온다"는 거짓 약속이 된다.
#    그 자리는 `drilldown_url` 이 이미 덮는다 — var-* 까지 실을 수 있어 더 정확하다.
#    되살리려면 `__dashboardUid__` + `__panelId__` 를 **쌍으로** 넣고 기동 검증부터 하라.
apiVersion: 1

templates:
  - orgId: 1
    name: keiwi-slack
    template: |
      {{ define "keiwi.title" -}}
      {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} [{{ .CommonLabels.severity | toUpper }}] {{ .CommonLabels.alertname }}{{ if .CommonLabels.node }} · {{ .CommonLabels.node }}{{ end }}{{ if gt (len .Alerts.Firing) 1 }} ×{{ len .Alerts.Firing }}{{ end }}
      {{- end }}

      {{ define "keiwi.alert" -}}
      {{- /* 제목(keiwi.title)이 이미 alertname·node를 말했다 — 본문에서 반복하면
           "DiskUsageHigh · nodeDiskUsageHigh · node — ..."처럼 읽힌다(2026-08-12 실채널 실측).
           본문은 summary부터 시작하고, summary가 없을 때만 이름으로 폴백한다. */ -}}
      {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}*{{ .Labels.alertname }}*{{ if .Labels.node }} · {{ .Labels.node }}{{ end }}{{ end }}
      시작 {{ .StartsAt | tz "Asia/Seoul" | date "01-02 15:04" }} KST
      {{ if .Annotations.console_url }}<{{ .Annotations.console_url }}|콘솔 분석>{{ end }}{{ if .Annotations.drilldown_url }} · <{{ .Annotations.drilldown_url }}|드릴다운>{{ end }}{{ if .SilenceURL }} · <{{ .SilenceURL }}|침묵>{{ end }}{{ if .Annotations.runbook_url }} · <{{ .Annotations.runbook_url }}|런북>{{ end }}
      {{- end }}

      {{ define "keiwi.text" -}}
      {{ range .Alerts.Firing }}{{ template "keiwi.alert" . }}
      {{ end }}{{ range .Alerts.Resolved }}✅ 해결: {{ .Labels.alertname }}{{ if .Labels.node }} · {{ .Labels.node }}{{ end }} ({{ .EndsAt | tz "Asia/Seoul" | date "15:04" }} KST)
      {{ end }}
      {{- end }}
