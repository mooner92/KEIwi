# Grafana 알림 라우팅 정책 — 어디로 보내고, 얼마나 묶고, 언제 다시 알릴지
#
# 적용: /data/monitoring/grafana/provisioning/alerting/ 로 복사(사람, §11).
#
# ⚠️ provisioning으로 정책을 넣으면 Grafana UI에서 편집이 잠긴다(파일이 진실원천).
#    바꾸려면 이 파일을 고쳐 다시 복사한다.
#
# ── 설계 원칙: 노이즈가 알림 체계를 죽인다 ────────────────────────────────
# 알림이 시끄러우면 사람이 무시하고, 무시하면 알림 없는 것보다 나쁘다(거짓 안심을 준다).
# 실제로 이 플릿은 alert 규칙 0건 상태에서 로그 인입이 5.7일간 멈춘 걸 아무도 몰랐다.
# 그래서 첫 세트는 "확실한 것 소수"만 켜고, 2주 관찰 후 늘린다.
#
# ── 그룹핑이 스레딩을 대신한다 ────────────────────────────────────────────
# Grafana Slack 알림기는 thread_ts를 지원하지 않는다(실측). 대신 group_by로 같은 종류를
# 한 메시지에 묶고, repeat_interval을 길게 잡아 같은 알림이 반복 도배되지 않게 한다.
#
# ※ E3 예고(alert-enrichment §3 · ADR-0025): 웹훅 중계(alert-relay)가 원 메시지를 직접
#   게시하면 응답으로 ts를 쥐므로 스레딩이 가능해진다. 아래 routes: 첫 항목에 섀도 미러
#   라우트가 **주석 상태로** 준비돼 있다 — 섀도 2주(§3.5 S2) 전에는 켜지 않는다.
#   컷오버 후에도 이 그룹핑 설정은 그대로 쓴다(relay는 그룹 payload를 그대로 받는다).
apiVersion: 1

policies:
  - orgId: 1
    # 기본 경로 — 명시적으로 라우팅되지 않은 모든 알림은 인프라 채널로.
    receiver: slack-infra
    # alertname+node로 묶는다: 한 노드에서 같은 알림이 여러 인스턴스로 터져도 메시지는 1건.
    group_by:
      - alertname
      - node
    # 첫 알림 전 30초 대기 — 동시에 터지는 것들을 한 메시지로 모은다.
    group_wait: 30s
    # 같은 그룹에 새 알림이 추가될 때 다음 통지까지의 간격.
    group_interval: 5m
    # 해결되지 않은 알림의 재통지 주기. 4시간 — 짧으면 도배, 길면 잊는다.
    repeat_interval: 4h

    routes:
      # ── [섀도 · 기본 비활성] alert-relay 미러 라우트 (E3 T-E3-3 · spec §3.5 S1) ──
      #
      # 왜 주석인가: 이 라우트를 켜면 Grafana가 `alert-relay` 수신처를 찾는데,
      # 그 수신처는 contact-points.relay.yaml 을 복사해야 생긴다. 없는 수신처를 참조하면
      # 프로비저닝이 실패하고 **Grafana가 뜨지 않는다**(하단 inhibitionRules 사고와 같은 유형).
      # 그래서 순서를 강제한다: env 배선 → 수신처 파일 복사 → 이 블록 주석 해제 → 리로드.
      #
      # `continue: true` 가 핵심이다 — 매칭 후에도 **형제 라우트 평가를 계속**하므로
      # 기존 직송(slack-infra/slack-web)이 그대로 살아 있다. 실채널 무영향이 섀도의 전제다.
      # ⚠️ [검증 필요] 파일 프로비저닝에서 `continue` 가 실제로 먹는지 확인한다.
      #    안 먹으면 섀도는 **테스트 전용 라벨**(예: 테스트 규칙에만 `shadow: "true"`)로 우회한다
      #    — 그 경우 아래 object_matchers 를 `["shadow", "=", "true"]` 로 바꾼다(열린 질문 2).
      #
      # - receiver: alert-relay
      #   continue: true
      #   object_matchers:
      #     - ["domain", "=", "infra"]
      #   # 그룹핑은 기존 라우트와 같게 둔다 — relay가 받는 payload가 실채널과 동형이어야
      #   # 섀도 관찰(유실·지연·품질)이 의미를 갖는다.
      #   group_by: ["alertname", "node"]
      #   group_wait: 30s
      #   group_interval: 5m
      #   repeat_interval: 4h

      # ── Grafana 자체 알림(DatasourceNoData/Error) — 도배 차단 ──────────
      # 실측(2026-08-12 실채널): DatasourceNoData가 **10분마다** 게시됐다. 원인은 이 알림이
      # 원 규칙의 라벨을 물려받지 못해 전용 라우트 없이 흘렀고, 노드별 시리즈가 그룹에
      # 드나들 때마다 group_interval 주기로 재통지된 것. 이 알림의 정보량은 "수집기가 아직
      # 없다" 한 문장이라 하루 한 번이면 충분하다 — **근본 수정은 수집기 배포**(hardware-ops
      # T0-2)이고, 이 라우트는 그때까지의 소음 통제다.
      - receiver: slack-infra
        object_matchers:
          - ["alertname", "=~", "DatasourceNoData|DatasourceError"]
        group_by: ["alertname"]   # 노드 드나듦이 재통지를 만들지 않게 이름으로만 묶는다
        group_wait: 5m
        group_interval: 4h
        repeat_interval: 24h

      # ── 앱 런타임(콘솔·API) → #keiwi-web ──────────────────────────────
      # 인프라 담당자와 앱 담당자가 볼 것이 다르므로 채널을 나눈다.
      # (현재는 1인이지만, 채널이 나뉘어야 음소거·검색·보존을 독립으로 관리할 수 있다)
      - receiver: slack-web
        object_matchers:
          - ["domain", "=", "app"]
        group_by: ["alertname"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

      # ── 인프라 critical — 재통지를 더 자주 ────────────────────────────
      - receiver: slack-infra
        object_matchers:
          - ["domain", "=", "infra"]
          - ["severity", "=", "critical"]
        group_by: ["alertname", "node"]
        group_wait: 15s      # critical은 덜 기다린다
        group_interval: 5m
        repeat_interval: 1h  # 해결될 때까지 1시간마다 상기

      # ── 인프라 warning — 조용하게 ─────────────────────────────────────
      - receiver: slack-infra
        object_matchers:
          - ["domain", "=", "infra"]
          - ["severity", "=", "warning"]
        # node 추가(E1 D1-5): [alertname]만으로는 두 노드가 같은 warning을 동시 발화하면
        # 한 메시지로 묶여 제목에서 노드가 사라진다(CommonLabels는 공유 라벨만 남는다).
        # 5노드 규모라 노드별 분리로 인한 도배 위험이 낮고, "어느 노드가 해결됐나"가 명확해진다.
        # 2주 리뷰에서 메시지 수 증가가 거슬리면 이 줄만 되돌린다.
        group_by: ["alertname", "node"]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 12h  # 경고는 하루 두 번이면 충분하다

# ── 억제(inhibition)는 파일 프로비저닝으로 할 수 없다 (2026-07-30 실측) ───
#
# 원래 여기에 `inhibitionRules:`를 넣었다가 **Grafana가 기동에 실패했다**(포트 3000 미리스닝).
# 공식 문서 확인 결과 파일 프로비저닝의 최상위 허용 키는 다음뿐이다:
#   apiVersion · groups · deleteRules · contactPoints · deleteContactPoints
#   templates · deleteTemplates · policies · resetPolicies · muteTimes · deleteMuteTimes
# `inhibitionRules`는 **없다.** `muteTimings`도 오타였다(올바른 이름은 `muteTimes`).
# 알 수 없는 최상위 키가 있으면 프로비저닝이 실패하고 Grafana가 뜨지 않는다.
#
# 억제 자체는 Grafana 내장 Alertmanager가 지원하지만 경로가 다르다 —
# `POST /api/alertmanager/grafana/config/api/v1/alerts` (설정 API)로만 넣을 수 있고,
# 그건 "설정을 코드로" 원칙에서 벗어난다(UI 수제와 같은 취급, 재생성 시 소실 위험).
#
# 그래서 지금은 **그룹핑으로 대체**한다:
#   NodeDown(critical)은 group_wait 15s로 먼저 나가고, 파생 warning들은 group_wait 1m ·
#   group_interval 10m으로 늦게·묶여서 나간다. 완전한 억제는 아니지만 "장애 1건에
#   알림 10건" 도배는 막는다.
# 진짜 억제가 필요해지면 별도 ADR로 설정 API 경로를 다루고, 그 소실 위험을 함께 적는다.
