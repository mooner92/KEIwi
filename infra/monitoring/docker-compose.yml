# KEIwi 모니터링 스택 — 권장본 (라이브 = data05:/data/monitoring/docker-compose.yml)
# ⚠️ 에이전트는 생성, 사람이 적용(§11). 라이브 반영 절차는 README "Grafana 익명 뷰어" 참고.
# 라이브와 차이:
#  - GF_SECURITY_ADMIN_PASSWORD를 .env(${GRAFANA_ADMIN_PASSWORD})로 — 시크릿 레포 밖(§13, README §보안)
#  - GF_AUTH_ANONYMOUS_*: LAN 익명 뷰어(조회 전용) — 내부(IP) 접속 임베드에서 로그인 없이 대시보드 표시.
#    쓰기/관리자는 여전히 로그인 필요. 외부(grafana.excusa.uk)는 Cloudflare Access가 앞단 차단.
version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - /data/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      # Recording rules 바인드(읽기전용). prometheus.yml 의 rule_files: /etc/prometheus/rules/*.yml 대응.
      # 레포 원본 infra/monitoring/rules/*.yml → 사람이 /data/monitoring/rules/ 에 복사(§11).
      - /data/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # 프로비저닝 바인드(영구) — docker cp 주입은 컨테이너 재생성 시 소실됨(2026-07-02 실제 발생:
      # keiwi-gpu·model-workload·logs 대시보드 소실 → 재프로비저닝). 레포가 원본, 호스트 경로에 복사해 바인드.
      - /data/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - /data/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      # 알림(수신처·라우팅·규칙) 프로비저닝 — 알림도 코드로 관리한다(UI 수제 금지, ADR-0016 교훈).
      - /data/monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true # 콘솔 iframe 임베드 허용(ADR-0002)
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # LAN 익명 뷰어(조회 전용) — 내부 접속 임베드 로그인 제거(2026-07-02).
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # Slack bot token — 값은 /data/monitoring/.env(root:root 0600)에 있고 여기선 참조만 한다.
      # contact-points.yaml이 $__env{SLACK_BOT_TOKEN}으로 읽으므로 시크릿이 레포에 들어가지 않는다(§13).
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # 트랙 A1 — textfile 수집기: 호스트의 위생 .prom을 읽는다(다른 노드와 동일 메트릭).
      #   생산자는 Ansible role `node-hygiene`이 **호스트에** 배포한다 — cron 수기 설치가 아니다
      #   (inventory.ini: data05 node_hygiene_consumer=container. 이 마운트가 곧 "소비처" 선언이다).
      - /var/lib/node_exporter/textfile:/host/textfile:ro
      # 트랙 A1 — systemd 수집기: 컨테이너에서 호스트 systemd/D-Bus를 봐야 유닛 상태 수집 가능.
      #   /run/systemd(호스트 systemd 런타임)는 읽기만 하므로 :ro 유지.
      - /run/systemd:/run/systemd:ro
      # ⚠️ D-Bus 소켓에서만 ':ro'를 제거했다 — 소켓 connect(2)에는 **쓰기 권한이 필요**하다.
      #   위 줄의 옛 주석이 예측한 실패가 실제로 일어나 있었다 [실측 2026-08-02, 08-03 재확인]:
      #     node_scrape_collector_success{collector="systemd",instance="192.168.1.105:9100"} = 0
      #     count by(instance)(node_systemd_unit_state) → .104=1280 .103=1145 .101=1050 · **.105 시리즈 0개**
      #   대가: data05 `nvidia-cdi-refresh.service`가 로컬 systemctl에서 failed인데 Prometheus에서는
      #   관측 불가 — 드라이버 사고의 2차 증거가 통째로 유실됐다(spec §1.1).
      #   호스트 소켓 모드는 srw-rw-rw-라 호스트 권한을 바꿀 필요가 없다(컨테이너 마운트 옵션만).
      #   ⚠️ 적용 전 서버에서 `docker logs node-exporter 2>&1 | grep -i 'systemd\|dbus'`로 원인을
      #      **확정**하라(T1-9). 로그가 이 가설과 다르면 되돌리고 재설계한다 — 추정만으로 적용하지 않는다.
      #      적용은 `docker compose up -d node-exporter`(해당 서비스만, ~15초 공백).
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # 트랙 A1 — 미사용 수집기 활성화(OS 위생). host 노드는 Ansible role(node-hygiene)이 동일 플래그를 준다
      #   (apt 노드는 /etc/default/… ARGS 주입, 수동설치 노드는 유닛 파일에 사람이 이미 넣어 뒀다).
      - "--collector.systemd"
      - "--collector.textfile.directory=/host/textfile"

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: always
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add:
      - SYS_ADMIN

volumes:
  prometheus_data:
  grafana_data:
