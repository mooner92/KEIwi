---
# roles/disk-smart-textfile/tasks/main.yml — RAID 뒤 물리 디스크 SMART 수집기 배포 (멱등)
#
# 에이전트 생성, 사람 적용(헌장 §11). 라이브 직접수정 금지(§12). 시크릿 없음(§13).
# 대상: node-exporter 가 textfile 을 읽고 smartctl >= 7.0 이 있는 **모든** 노드.
#
# 왜 node-hygiene 확장이 아니라 별도 role 인가 (spec §2.3 / ADR-0024)
#   node-hygiene 은 apt 노드 판별과 소비처 선언을 자기 계약으로 갖고 있고 주기도 30분이다.
#   같은 스크립트에 SMART 를 얹으면 `set -e` 하나로 apt 실패가 SMART 수집까지 죽인다.
#   가드 조건(여기: smartctl 버전)도, 주기(15분)도, 실패 영향 범위도 다르다.
#
# 가드는 **두 조건의 AND** 다 — 소비처(textfile 디렉터리)와 생산 능력(smartctl >= 7.0).
#   디렉터리를 여기서 만들지 않는 것이 의도다: 없다는 것은 node-exporter 가 그 경로를
#   읽지 않는다는 뜻이고, 만들어버리면 "소비처 없는 생산자"가 조용히 깔린다
#   (축1이 node-hygiene 에서 고친 실패모드의 거울상).

- name: smartctl 존재·버전 확인(--json 은 7.0부터)
  ansible.builtin.command: "{{ disk_smart_smartctl_path }} --version"
  register: _smartctl_ver
  changed_when: false
  failed_when: false
  # ⚠️ check_mode: false 는 필수다. command/shell 모듈은 --check 에서 **스킵**되어
  #    register 에 rc·stdout 이 없고, 그러면 아래 가드가 통째로 거짓이 되어 role 전체가
  #    드라이런에서 사라진다. 그 상태의 AC-2-10(changed=0)은 "아무것도 안 해서 0"이라
  #    **공허하게** 통과한다 — 검사한다고 써놓고 아무것도 안 하는 상태다.
  #    레포의 기존 관용구와 동일하다(roles/gpu-model-exporter/tasks/main.yml:8-13,
  #    roles/node-hygiene/tasks/main.yml:50-62 — changed_when/failed_when/check_mode 3종 세트).
  check_mode: false

- name: node-exporter textfile 디렉터리 존재 확인(소비처가 있는가)
  ansible.builtin.stat:
    path: "{{ disk_smart_textfile_dir }}"
  register: _disk_smart_textfile_dir
  check_mode: false

- name: set_fact — smartctl 버전 문자열 추출
  # regex_search 가 매치하지 않으면 None 이다. join('') 으로 빈 문자열까지 내려보내고
  # default('0', true) 로 "버전 없음"을 명시적인 0 으로 만든다 — 예외를 던지면
  # smartctl 없는 노드에서 role 이 실패하고, 그건 스킵되어야 할 상황이다.
  ansible.builtin.set_fact:
    disk_smart_detected_version: >-
      {{ (_smartctl_ver.stdout | default('')
          | regex_search('smartctl\s+([0-9]+\.[0-9]+)', '\1')
          | default([], true) | join('')) | default('0', true) }}

- name: set_fact — 이 노드에 수집기를 깔 수 있는가
  ansible.builtin.set_fact:
    disk_smart_ready: >-
      {{ (_smartctl_ver.rc | default(1)) == 0
         and (disk_smart_detected_version is version(disk_smart_min_version, '>='))
         and (_disk_smart_textfile_dir.stat.exists | default(false))
         and (_disk_smart_textfile_dir.stat.isdir | default(false)) }}

- name: 대상 아님 — 사유를 남기고 스킵(조용히 넘어가지 않는다)
  ansible.builtin.debug:
    msg: >-
      disk-smart-textfile 스킵({{ inventory_hostname }}):
      smartctl rc={{ _smartctl_ver.rc | default('없음') }}
      version={{ disk_smart_detected_version }} (필요 >= {{ disk_smart_min_version }}),
      textfile_dir={{ disk_smart_textfile_dir }}
      exists={{ _disk_smart_textfile_dir.stat.exists | default(false) }}.
      data01(Ubuntu 16.04)은 apt 후보가 6.4(--json 미지원)라 여기서 걸린다 —
      infra/monitoring/disk-smart/smartmontools-xenial/ 참고(배포는 T2-17 검증 후).
  when: not (disk_smart_ready | bool)

- name: 물리 디스크 SMART 수집 스크립트 배포
  ansible.builtin.template:
    src: keiwi-disk-smart.sh.j2
    dest: "{{ disk_smart_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: disk_smart_ready | bool
  notify:
    - reload systemd (disk-smart)
    - run disk-smart once

- name: 수집기 실행 유닛(oneshot) 배포
  ansible.builtin.template:
    src: keiwi-disk-smart.service.j2
    dest: /etc/systemd/system/keiwi-disk-smart.service
    owner: root
    group: root
    mode: "0644"
  when: disk_smart_ready | bool
  notify:
    - reload systemd (disk-smart)
    - run disk-smart once

- name: 수집 주기 타이머 유닛 배포
  ansible.builtin.template:
    src: keiwi-disk-smart.timer.j2
    dest: /etc/systemd/system/keiwi-disk-smart.timer
    owner: root
    group: root
    mode: "0644"
  when: disk_smart_ready | bool
  notify:
    - reload systemd (disk-smart)

- name: 수집 타이머 enable + 기동
  ansible.builtin.systemd:
    name: keiwi-disk-smart.timer
    state: started
    enabled: true
    daemon_reload: true
  # --check 에선 유닛 파일이 실제로 안 써져 systemctl 이 못 찾는다 → 드라이런 스킵.
  # (드라이런에서 기대하는 changed 는 스크립트·유닛·타이머 **3건**이다 — T2-12)
  when:
    - disk_smart_ready | bool
    - not ansible_check_mode
