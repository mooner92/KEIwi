---
# roles/node-hygiene/tasks/main.yml — node-exporter textfile 수집기(OS 위생 + NVIDIA 정합성) 배포.
#
# 에이전트 생성, 사람 적용(헌장 §11). 라이브 직접수정 금지(§12). 시크릿 없음(§13).
# 대상: node-exporter가 textfile 수집기를 읽는 **모든** 노드(data01·03·04·05).
#   설치 방식(apt/수동/컨테이너)이 가르는 것은 ARGS 주입 태스크 하나뿐이고, 나머지는
#   호스트 레벨 작업이라 설치 방식과 무관하다.
#   ⚠️ 2026-08-02 이전 이 role은 `/etc/default/prometheus-node-exporter` stat 하나로 7개
#      태스크 전부를 게이팅해서 data05(컨테이너)·data01(수동설치)에 수집기가 도달하지 못했다.
#      두 노드 다 node-exporter가 textfile 디렉터리를 이미 정상적으로 읽고 있었다
#      (node_scrape_collector_success{collector="textfile"}=1) — 배관은 완비, 생산자만 부재.
#      그 결과 data05는 62일간 NVIDIA 커널모듈 595.71.05 ↔ 유저스페이스 595.84 불일치로
#      nvidia-smi가 exit 18인데 알림이 0건이었다. (specs/fleet-hardening/spec.md §1.1)
# 소비처(node-exporter가 어떻게 .prom을 읽는가)는 node_hygiene_consumer로 **명시 선언**한다
#   — 가드를 그냥 없애면 "소비처 없는 노드에 생산자만 깔리는" 새 실패모드가 생긴다(D1-1).

- name: apt node-exporter 설치 여부 확인(ARGS 파일 존재 = apt 노드)
  ansible.builtin.stat:
    path: "{{ node_hygiene_defaults_file }}"
  register: _nodeexp_default
  check_mode: false   # --check에서도 실제 확인 → 아래 판별이 신뢰 가능

- name: set_fact — apt node-exporter 여부(ARGS 주입 대상 판별에만 사용)
  # 변수명·의미를 좁히는 것이 이 role 교정의 핵심이다.
  # 예전: "이 노드에 role을 적용할지" → 지금: "ARGS를 자동 주입할 수 있는 노드인지".
  ansible.builtin.set_fact:
    node_hygiene_is_apt_node: "{{ _nodeexp_default.stat.exists | bool }}"

- name: 소비처 선언 강제(명시적 옵트인 — 미선언 노드에 생산자만 깔리는 것 방지)
  ansible.builtin.assert:
    that: node_hygiene_consumer | default('') in ['host', 'container']
    fail_msg: >-
      node_hygiene_consumer 미선언({{ inventory_hostname }}).
      inventory.ini에 host(=node-exporter가 --collector.textfile.directory로 직접 읽음)
      또는 container(=compose 바인드마운트로 읽음)를 선언하라.
  # --check에서도 실패해야 한다 — 미선언은 드라이런에서 잡아야 배포 전에 고친다(AC-1-14).

- name: 소비처 실증 검증(host 노드 — 실행 중 node-exporter가 정말 이 디렉터리를 읽는가)
  # ⚠️ 패턴을 cmdline **선두에 앵커**하는 것이 이 태스크의 정확성 전부다.
  #    `pgrep -f`는 **자기 자신을 감싼 셸도 매칭한다** — ansible shell 모듈은 `/bin/sh -c '<명령>'`으로
  #    도는데 그 cmdline 안에 `node_exporter`와 `--collector.textfile.directory=…`가 문자열로 들어 있다.
  #    앵커가 없으면 **항상 rc=0**이 되어 검증이 아니라 "항상 통과하는 장식"이 된다.
  #    실측 2026-08-03: 앵커 없는 패턴은 4노드 전부에서 래퍼 셸을 함께 잡았고,
  #    앵커 후에는 data01 `/usr/local/bin/node_exporter …` · data03/04 `/usr/bin/prometheus-node-exporter …`만
  #    잡히며(rc=0), 같은 문자열을 cmdline에 담은 래퍼 셸은 rc=1이다(음성 대조 성립).
  # ⚠️ 파이프도 정규식 교대(`|`)도 쓰지 않는다 — `sh`는 dash라 `set -o pipefail`이 없고,
  #    ansible-lint의 risky-shell-pipe는 명령 문자열의 `|` 문자만 보므로 정규식 안의 교대도
  #    오탐한다. `(prometheus-)?node[_-]exporter` 하나로 두 설치 형태를 다 덮는다
  #    (수동설치 `node_exporter` · Debian 패키지 `prometheus-node-exporter`).
  ansible.builtin.shell: >-
    pgrep -f
    '^([^[:space:]]*/)?(prometheus-)?node[_-]exporter[[:space:]].*--collector\.textfile\.directory={{ node_hygiene_textfile_dir | regex_escape }}'
    >/dev/null
  register: _consumer_ok
  changed_when: false
  failed_when: false
  # ⚠️ check_mode: false 는 필수다. shell/command 모듈은 --check에서 스킵되어 _consumer_ok에
  #    rc가 없고, 아래 fail의 `rc | default(1) != 0`이 참이 되어 data01(consumer=host + 非apt)이
  #    드라이런에서 거짓 실패한다 → AC-1-2의 "4호스트 failed=0"이 착수 시점부터 깨진다.
  #    레포의 기존 관용구와 동일하다 — roles/gpu-model-exporter/tasks/main.yml:8-13,
  #    roles/port-exporter/tasks/main.yml:6-11 (changed_when/failed_when/check_mode 3종 세트).
  check_mode: false
  when: node_hygiene_consumer == 'host'

- name: 소비처 없음 — 자동 교정 불가(사람이 유닛 수정 필요, §11)
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}의 node-exporter가 {{ node_hygiene_textfile_dir }}를 읽지 않는다.
      apt 노드가 아니라 ARGS 자동 주입도 불가 → 유닛 파일을 사람이 고쳐야 한다.
  when:
    - node_hygiene_consumer == 'host'
    - not (node_hygiene_is_apt_node | bool)
    # rc 부재 = "이 태스크가 아예 안 돌았다" → default(1)로 fail-closed.
    # 조용히 통과하는 쪽으로 기울이지 않는다(D1-1 --check 규약 표).
    - _consumer_ok.rc | default(1) != 0

- name: textfile 수집 디렉터리 보장(node-exporter가 읽음)
  ansible.builtin.file:
    path: "{{ node_hygiene_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"   # world-readable — node-exporter(prometheus 사용자)가 *.prom을 읽는다

- name: node-exporter ARGS에 systemd·textfile 수집기 플래그 주입(멱등)
  # 이 role에서 **유일한 apt 전용 태스크**다(Debian 패키지의 /etc/default/… 계약).
  # 주의: 기존 ARGS를 통째로 교체한다. 온보딩 기본값(ARGS="")을 전제.
  #       노드에 커스텀 ARGS가 있다면 node_hygiene_extra_collectors에 합쳐 override 할 것.
  ansible.builtin.lineinfile:
    path: "{{ node_hygiene_defaults_file }}"
    regexp: '^ARGS='
    line: 'ARGS="{{ node_hygiene_node_exporter_args }}"'
    backup: true
  when: node_hygiene_is_apt_node | bool
  notify: restart node-exporter (apt)

- name: 적용 스탬프 파일 보장(최초 1회 생성 — mtime=마지막 적용 시각)
  ansible.builtin.copy:
    dest: "{{ node_hygiene_marker }}"
    content: "keiwi node-hygiene apply marker\n"
    owner: root
    group: root
    mode: "0644"
    force: false   # 이미 있으면 건드리지 않음 → mtime 보존(변경 시에만 핸들러가 touch)

- name: OS 위생 textfile 수집 스크립트 배포
  ansible.builtin.template:
    src: keiwi-node-hygiene.sh.j2
    dest: "{{ node_hygiene_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify:
    - stamp node-hygiene apply
    - run node-hygiene once

- name: 수집기 실행 유닛(oneshot) 배포
  ansible.builtin.template:
    src: keiwi-node-hygiene.service.j2
    dest: /etc/systemd/system/keiwi-node-hygiene.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - stamp node-hygiene apply
    - run node-hygiene once

- name: 수집기 주기 타이머 유닛 배포
  ansible.builtin.template:
    src: keiwi-node-hygiene.timer.j2
    dest: /etc/systemd/system/keiwi-node-hygiene.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - stamp node-hygiene apply

- name: 수집 타이머 enable + 기동
  ansible.builtin.systemd:
    name: keiwi-node-hygiene.timer
    state: started
    enabled: true
    daemon_reload: true
  # --check에선 유닛 파일이 실제로 안 써져 systemctl이 못 찾음 → 드라이런 스킵(실적용에서만 기동).
  when: not ansible_check_mode

# ── systemd-networkd-wait-online 타임아웃 교정 (T0-7, 2026-07-30) ──────────────
#
# 3노드(data03·04·05) 공통으로 이 유닛이 failed다. 원인 실측(data03):
#   bond0은 routable인데 eno2가 "no-carrier + configured" — 케이블이 안 꽂힌 포트가
#   관리 대상으로 설정돼 있어 wait-online이 전 인터페이스를 기다리다 타임아웃(exit 1).
# 부팅 지연 + failed 유닛 노이즈만 만들 뿐 런타임 무해. 교정은 --any:
# "관리 인터페이스 중 하나라도 온라인이면 통과" — bond0 하나면 충분하다.

- name: networkd-wait-online drop-in 디렉터리
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: node_hygiene_fix_wait_online | bool

- name: networkd-wait-online --any drop-in 배포(멱등)
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/keiwi-any.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # KEIwi node-hygiene: no-carrier 포트(eno2 등) 대기로 인한 부팅 타임아웃 교정.
      # --any = 관리 인터페이스 중 하나(bond0)라도 온라인이면 통과.
      [Service]
      ExecStart=
      ExecStart=/lib/systemd/systemd-networkd-wait-online --any
  register: _waitonline_dropin
  when: node_hygiene_fix_wait_online | bool

- name: networkd-wait-online daemon-reload + failed 상태 리셋
  ansible.builtin.systemd:
    daemon_reload: true
  when: node_hygiene_fix_wait_online | bool and _waitonline_dropin is changed
