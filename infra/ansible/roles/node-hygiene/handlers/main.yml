---
# roles/node-hygiene/handlers/main.yml — 변경 시에만 반응(멱등).
# 핸들러는 "정의 순서"대로 실행된다 → stamp(마커 갱신)를 run-once(스크립트 실행)보다 먼저 둔다.

- name: restart node-exporter (apt)
  # ARGS 변경 시에만 재시작 → systemd·textfile 수집기 반영.
  ansible.builtin.systemd:
    name: "{{ node_hygiene_service_name }}"
    state: restarted
    enabled: true
    daemon_reload: true

- name: stamp node-hygiene apply
  # 스크립트/유닛이 실제로 변경됐을 때만 마커 mtime 갱신
  # → node_ansible_last_apply_timestamp_seconds(수집 스크립트가 mtime을 읽어 노출).
  ansible.builtin.file:
    path: "{{ node_hygiene_marker }}"
    state: touch
  when: not ansible_check_mode

- name: run node-hygiene once
  # 배포 직후 .prom을 즉시 1회 생성(타이머 첫 tick 대기 없이).
  ansible.builtin.systemd:
    name: keiwi-node-hygiene.service
    state: started
    daemon_reload: true
  when: not ansible_check_mode
