# infra/ansible/inventory.ini — KEIwi 플릿 로그 수집 대상 인벤토리
#
# 에이전트 생성, 사람 적용(헌장 §11). 시크릿 없음(§13) — 키/비번은 레포 밖.
# 단일 기준은 docs/inventory.yaml(§0). 여기 값은 그와 일치한다.
#
# control 노드 = data05(관제 스택 호스트 + 개발). data05에서 ansible-playbook 실행.
#   · data05 → 자기 자신: ansible_connection=local (포트 764로 self-SSH 불필요)
#   · data05 → data04   : SSH 포트 764, 사용자 mhchoi, 키 인증
#                          (전제: data05의 공개키가 data04 mhchoi에 등록 — README 참고)
#
# fleet_node: Logstash가 정규화하는 계약 필드. Filebeat add_fields로 주입(서버 식별).
#             값은 docs/inventory.yaml의 노드 id와 정확히 일치(data04|data05).
#
# 수집 대상: data03(직접, 2026-07-03 온보딩)·data04(터널)·data05(local). data01~02는 접근 준비 후 추가.

#
# node_hygiene_* 호스트 변수(roles/node-hygiene/defaults/main.yml 기본값의 예외만 적는다):
#   node_hygiene_consumer=container  — node-exporter가 컨테이너라 compose 바인드마운트로 .prom을 읽는다
#   node_hygiene_apt_enabled=false   — apt 카운터 미수집(신호 가치 0인 노드)

[logging]
data03 ansible_host=192.168.1.103 ansible_user=mooner92 fleet_node=data03
data04 ansible_host=192.168.1.104 ansible_user=mhchoi fleet_node=data04
# data05: node-exporter가 docker 컨테이너다(/var/lib/node_exporter/textfile → /host/textfile:ro).
#   host가 아니므로 ARGS 주입도 pgrep 소비처 검증도 대상이 아니다 — compose가 소비처다.
data05 ansible_host=192.168.1.105 ansible_connection=local fleet_node=data05 node_hygiene_consumer=container

[logging:vars]
# data04 sshd 표준 포트(§ KEIwi 인프라). local 연결인 data05에는 무시된다.
ansible_port=764
ansible_python_interpreter=/usr/bin/python3

# GPU 노드 — gpu-model-exporter(:9836) 적용 대상(playbooks/agents.yml). ADR-0017.
# 호스트 연결 변수(ansible_host/user/connection)는 위 [logging] 라인에서 머지된다.
[gpu]
data01
data03
data04
data05

[gpu:vars]
ansible_port=764
ansible_python_interpreter=/usr/bin/python3

# 모든 관리 노드 — port-exporter(:9986, 리스닝 포트↔프로세스) 적용 대상(agents.yml). ADR-0017.
[nodes]
# data01: 16.04·py3.6(ansible-core 2.16까지 지원)·filebeat 보류(xenial) — 메트릭만(2026-07-24)
#   node_hygiene_apt_enabled=false: 16.04 EOL이라 apt 대기 248건이 **영원히** 줄지 않는다.
#   신호 가치 0인데 30분마다 가장 무거운 작업을 돌리고, 이 노드는 Jupyter 커널 RSS로 이미
#   메모리 압박 상태다. 나머지 위생(reboot·apply-time·NVIDIA 정합성)은 그대로 수집한다.
#   node-exporter는 수동설치(/usr/local/bin/node_exporter, v1.8.2)라 apt 노드가 아니지만
#   --collector.textfile.directory가 이미 붙어 있다 → consumer=host(기본값)로 성립 [실측].
data01 ansible_host=192.168.1.101 ansible_user=mhchoi fleet_node=data01 node_hygiene_apt_enabled=false
data03
data04
data05

[nodes:vars]
ansible_port=764
ansible_python_interpreter=/usr/bin/python3

# --- 1·2 추가 시(접근 준비 후) ---
# 각 노드를 [logging]에 추가하고 fleet_node를 data0N으로 지정:
#   data01 ansible_host=192.168.1.101 ansible_user=<user> fleet_node=data01
# (ansible_port가 764가 아니면 해당 호스트 라인에 ansible_port=<port>로 override)
# data02는 Windows — winlogbeat role 부재(백로그 B02), 아직 대상 아님.
