# infra/ansible/ansible.cfg — KEIwi M2 통합 로그 수집(Filebeat) Ansible 설정
#
# 에이전트가 생성하고, 적용(프로덕션 배포)은 사람이 한다. (헌장 §11)
# 라이브 스택 직접수정 금지(§12). 시크릿은 레포 밖(§13) — 이 트리에 비번/토큰 없음.
#
# 실행(데이터05을 control로):
#   cd infra/ansible
#   ansible-playbook -i inventory.ini playbooks/logging.yml
#
# 이 파일은 infra/ansible/ 안에서 ansible-playbook을 실행할 때 자동으로 읽힌다.

[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml
deprecation_warnings = False

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
# data04는 sshd 포트 764 — 인벤토리의 ansible_port로 지정.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
