---
# playbooks/agents.yml — 노드별 모니터링 에이전트 적용(GPU 모델 익스포터 등).
#
# 에이전트 생성, 사람 적용(헌장 §11). 로그(filebeat)는 playbooks/logging.yml 참조.
# 실행(사람, control=data05):
#   cd infra/ansible
#   ansible-playbook -i inventory.ini playbooks/agents.yml --limit data04 -K --check --diff
#   ansible-playbook -i inventory.ini playbooks/agents.yml --limit data04 -K
#   ※ -K(--ask-become-pass): 대상의 sudo가 NOPASSWD가 아니면 필요 — **실측상 data05뿐이다**
#     (2026-08-02 4노드 전수 `sudo -n true`: data01·03·04 rc=0, **data05 rc=1**.
#      data05 sudoers의 `(ALL) NOPASSWD: ALL` 뒤에 `(ALL : ALL) ALL`이 와서 마지막 규칙이 이긴다).
#     ansible.cfg가 become=True라 **--check(드라이런)에서도** data05는 -K가 필요하다.
#     "BECOME password:" 프롬프트에 그 노드 sudo 비번 입력(레포 저장 안 함 §13 —
#      -e ansible_become_password=로 넘기지 말 것. 프로세스 목록에 남는다).
#     프롬프트를 1회로 줄이려면 `--limit data05 -K`로 분리 실행한다.
#     hardware-ops T0-6(data05 sudoers 순서 교정)이 끝나면 -K 자체가 불필요해진다.
#
# 향후 node-exporter·dcgm-exporter role도 여기에 묶는다(ADR-0017 백로그).

- name: GPU 모델 익스포터 (GPU 노드)
  hosts: gpu
  become: true
  gather_facts: true
  tags: [gpu-model]
  roles:
    - gpu-model-exporter

- name: 리스닝 포트↔프로세스 익스포터 (모든 노드)
  hosts: nodes
  become: true
  gather_facts: true
  tags: [port]
  roles:
    - port-exporter

- name: 디스크/NVMe SMART 익스포터 (모든 노드)
  hosts: nodes
  become: true
  gather_facts: true
  tags: [smartctl]
  roles:
    - smartctl-exporter

# node-exporter 미사용 수집기(systemd·textfile) 활성화 + OS 위생/NVIDIA 정합성 메트릭.
# **전 노드(data01·03·04·05)에 실제 적용된다.** 설치 방식이 가르는 것은 ARGS 주입 태스크
# 하나뿐이고(apt 노드만), 수집 스크립트·유닛·타이머는 호스트 레벨이라 방식과 무관하다.
# data05는 node-exporter가 컨테이너지만 .prom을 읽는 경로가 호스트 바인드마운트이므로
# 수집 스크립트는 여기서 배포한다(inventory.ini의 node_hygiene_consumer=container).
# 알림은 이 role이 만들지 않는다 — 커버리지 알림 2건은 Grafana 프로비저닝 소관(spec §1.2 D1-4).
- name: OS 위생 수집기 (node-exporter textfile·systemd, 전 노드)
  hosts: nodes
  become: true
  gather_facts: true
  tags: [node-hygiene]
  roles:
    - node-hygiene
