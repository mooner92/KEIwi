# docs/inventory.yaml — 플릿 단일 기준 (source of truth)
#
# 헌장 §0의 노드 맵을 옮긴 것. service discovery·온보딩의 단일 기준이며,
# 노드 추가·변경은 이 파일을 고치는 것으로 시작한다. (헌장 §0)
#
# 포트 표준 기본값: node_exporter 9100 / windows_exporter 9182 / DCGM 9400.
# 실제 값은 확정 시 이 파일에서 갱신한다. (확인 필요)
nodes:
  - id: data01                 # 안정적 식별자 (변하지 않음)
    ip: 192.168.1.101
    hostname: ""               # 알면 채움
    os: ubuntu                 # ubuntu | windows
    role: target               # target | stack-host
    gpu: null                  # 예: "A40 x2" | null
    exporters:                 # 있는 것만. 포트는 기본값(확인 필요)
      node: "192.168.1.101:9100"

  - id: data02
    ip: 192.168.1.102
    hostname: ""
    os: windows
    role: target
    gpu: null
    exporters:
      windows: "192.168.1.102:9182"   # windows_exporter 기본 포트

  - id: data03
    ip: 192.168.1.103
    hostname: "datalx03"          # node_uname_info nodename 확인(2026-07-03)
    os: ubuntu
    role: target
    gpu: "Quadro RTX 6000 x2"    # lspci TU102GL x2 확인(2026-07-03) — 드라이버 설치 후 dcgm 활성
    exporters:
      node: "192.168.1.103:9100"
      dcgm: "192.168.1.103:9400"   # 직접 스크랩(터널 불필요) — data03 ufw .105→9400 허용

  - id: data04
    ip: 192.168.1.104
    hostname: "data04lx"          # node_uname_info nodename — Grafana var-nodename 드릴다운용
    os: ubuntu
    role: target
    gpu: "Quadro RTX 6000 x2"    # 각 24GB (nvidia-smi 확인)
    exporters:
      node: "192.168.1.104:9100"
      dcgm: "192.168.1.104:9400"   # DCGM exporter — data04에 설치 필요(아래 서버 단계) + 터널 9404

  - id: data05
    ip: 192.168.1.105
    hostname: "efc20b3d818e"      # 실제 OS hostname(랜덤형) — hostnamectl로 정리 권장. 드릴다운 var-nodename용
    os: ubuntu
    role: stack-host           # 개발(Claude Code) + 관제 스택 호스트
    gpu: "A40 x2"
    exporters:
      node: "192.168.1.105:9100"
      dcgm: "192.168.1.105:9400"
